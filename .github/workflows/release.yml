name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows, macOS, Debian ────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin requires both arch targets on the macOS runner
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Install Debian/Ubuntu system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ursula ${{ github.ref_name }}'
          releaseBody: |
            ## What's new in v0.3.0

            **New features:**
            - Double-click any inventory or playbook file to open it in your editor (system default, or configure a custom editor in Settings → General)
            - Full git commit/push workflow built in — when Git is enabled, a smart button in the toolbar shows your current repo state:
              - **Commit** (yellow): uncommitted changes detected — click to stage all and commit with a message
              - **Push (N)** (blue): N commits ahead of origin — click to push
              - **Status** (muted): repo is clean — click to run `git status` in the terminal
            - Git state auto-refreshes on app focus, after every git operation, and after saving settings

            ---
            Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}